name: package

# Builds the actual container and boots it. Runtime first-load model: the build
# is fetch-free (no dataset is baked), so this job is fast and deterministic — it
# does NOT depend on live feeds. The dataset is populated at runtime by the
# entrypoint's background ingest, which is network-dependent and therefore not
# asserted here; the pipeline's ordering invariants are covered hermetically by
# tests/test_packaging.py. This job asserts the container boots healthy and
# serves the feed page (an empty feed is valid on first load).
on:
  pull_request:
    paths:
      - "app/**"
      - "seeds/**"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "deploy/**"
      - ".github/workflows/package.yml"

jobs:
  docker-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (fetch-free — no ingest at build)
        run: docker build -t gridsignals:ci .

      - name: Boot container
        run: docker run -d --name gs -p 8000:8000 gridsignals:ci

      - name: Wait for health (app serves immediately; feed fills in later)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/healthz; then echo " healthy"; exit 0; fi
            sleep 2
          done
          echo "container did not become healthy in time"; exit 1

      - name: Assert the feed page serves (empty feed is valid on first load)
        run: curl -sf http://127.0.0.1:8000/ > /dev/null && echo "OK: feed page served"

      - name: Container logs on failure
        if: failure()
        run: docker logs gs || true

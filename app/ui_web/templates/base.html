<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GridSignals{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
</head>
<body class="gs-body">
  <header class="gs-topbar">
    <span class="gs-brand">GridSignals</span>
    <nav class="gs-nav">
      <a href="/" class="{{ 'active' if nav_active == 'home' else '' }}">Home</a>
      <a href="/account" class="{{ 'active' if nav_active == 'account' else '' }}">Account 360</a>
      <a href="/review" class="{{ 'active' if nav_active == 'review' else '' }}">Review</a>
      <a href="/precision" class="{{ 'active' if nav_active == 'precision' else '' }}">Precision</a>
      <a href="/retiers" class="{{ 'active' if nav_active == 'retiers' else '' }}">Re-tiers</a>
      <a href="/regulatory" class="{{ 'active' if nav_active == 'regulatory' else '' }}">Regulatory</a>
      <a href="/digest" class="{{ 'active' if nav_active == 'digest' else '' }}">Digest</a>
      <a href="/admin" class="{{ 'active' if nav_active == 'admin' else '' }}">Admin</a>
    </nav>
  </header>
  <div id="flash" class="gs-flash" aria-live="polite">{% block flash %}{% endblock %}</div>
  <main class="gs-main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
